<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultas - Libreta de Fiados</title>
<meta name="theme-color" content="#1e6fd9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiados">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="contenedor">
<main class="panel panel-consultas">
<h1>Consultas</h1>
<p class="nav"><a class="pill volver" href="/">← Volver a subir hojas</a></p>
<div class="tabs" id="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-v="deudores" class="on">Quién debe</button>
  <button role="tab" aria-selected="false" data-v="movimientos">Movimientos</button>
  <button role="tab" aria-selected="false" data-v="resumen">Resumen</button>
  <button role="tab" aria-selected="false" data-v="productos">Productos</button>
</div>
<div class="filtros" id="filtros"></div>
<div id="msg" aria-live="polite"></div>
<div id="out"></div>
<ul class="marcas" aria-label="Marcas frecuentes en las hojas">
  <li class="marca m-alpina">Alpina</li>
  <li class="marca m-cocacola">Coca-Cola</li>
  <li class="marca m-diana">DIANA</li>
  <li class="marca m-roa">Roa</li>
  <li class="marca m-postobon">Postobón</li>
  <li class="marca m-bavaria">Bavaria</li>
  <li class="marca m-nestle">Nestlé</li>
</ul>
</main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const $$ = (s) => [...document.querySelectorAll(s)];
const money = (n) => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let vista = "deudores", clientes = [];
const iniciales = (n) => String(n ?? "").trim().split(/\s+/).slice(0, 2).map(p => p[0] || "").join("").toUpperCase();
const colorAvatar = (n) => { let h = 0; for (const c of String(n ?? "")) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 40%)`; };

async function api(url){
  $("msg").textContent = "";
  try{
    const r = await fetch(url);
    const d = await r.json();
    if(!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Error en la consulta.");
    return d;
  }catch(e){ $("msg").textContent = e.message; return null; }
}
const qs = (o) => new URLSearchParams(Object.entries(o).filter(([,v]) => v !== "" && v != null)).toString();
const val = (id) => $(id) ? $(id).value : "";

function fechas(){ return `<label>Desde<input type="date" id="desde"></label><label>Hasta<input type="date" id="hasta"></label>`; }
function btn(){ return `<button id="ir">Consultar</button>`; }

function pintarFiltros(){
  const f = $("filtros");
  if(vista==="deudores") f.innerHTML = `<label><span>Incluir clientes sin deuda</span><input type="checkbox" id="todos"></label>`+btn();
  if(vista==="movimientos") f.innerHTML = `
    <label>Cliente<select id="cliente"><option value="">Todos</option>${clientes.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></label>
    <label>Tipo<select id="tipo"><option value="">Todos</option><option value="venta">Venta</option><option value="fiado">Fiado</option><option value="abono">Abono</option></select></label>`+fechas()+btn();
  if(vista==="resumen"||vista==="productos") f.innerHTML = fechas()+btn();
  $("ir").onclick = consultar;
}

async function consultar(){
  $("out").innerHTML = "";
  if(vista==="deudores"){
    const d = await api("/api/consultas/deudores?"+qs({todos: $("todos").checked}));
    if(!d) return;
    const total = d.reduce((a,x)=>a+x.saldo,0);
    $("out").innerHTML = `<div class="tarjetas"><div class="t t-rojo">Deuda total<b class="deuda">${money(total)}</b></div><div class="t t-azul">Clientes<b>${d.length}</b></div></div>`+
      (d.length ? `<table><tr><th>Cliente</th><th class="n">Saldo</th></tr>${d.map(x=>`<tr><td><div class="cli"><span class="avatar" aria-hidden="true" style="background:${colorAvatar(x.nombre)}">${esc(iniciales(x.nombre))}</span><a class="cli-link" href="#" data-id="${x.cliente_id}">${esc(x.nombre)}</a></div></td><td class="n ${x.saldo>0?"deuda":"ok-saldo"}">${money(x.saldo)}</td></tr>`).join("")}</table>` : "<p>Nadie debe nada.</p>");
    $$("a.cli-link").forEach(a => a.onclick = (e) => { e.preventDefault(); verCliente(a.dataset.id); });
  }
  if(vista==="movimientos"){
    const d = await api("/api/consultas/movimientos?"+qs({cliente_id:val("cliente"),tipo:val("tipo"),desde:val("desde"),hasta:val("hasta")}));
    if(d) $("out").innerHTML = tablaMov(d);
  }
  if(vista==="resumen"){
    const d = await api("/api/consultas/resumen?"+qs({desde:val("desde"),hasta:val("hasta")}));
    if(!d) return;
    const p = d.por_tipo, nom = {venta:"Ventas de contado",fiado:"Fiados",abono:"Abonos"}, col = {venta:"t-azul",fiado:"t-naranja",abono:"t-verde"};
    $("out").innerHTML = `<div class="tarjetas">${["venta","fiado","abono"].map(k=>`<div class="t ${col[k]}">${nom[k]} (${p[k].cantidad})<b>${money(p[k].total)}</b></div>`).join("")}<div class="t t-rojo">Deuda total hoy<b class="deuda">${money(d.deuda_total_actual)}</b></div></div>`;
  }
  if(vista==="productos"){
    const d = await api("/api/consultas/productos?"+qs({desde:val("desde"),hasta:val("hasta")}));
    if(d) $("out").innerHTML = d.length ? `<table><tr><th>Producto</th><th class="n">Unidades</th><th class="n">Total</th></tr>${d.map(x=>`<tr><td>${esc(x.nombre)}</td><td class="n">${x.unidades}</td><td class="n">${money(x.total)}</td></tr>`).join("")}</table>` : "<p>Sin ventas con productos en ese rango.</p>";
  }
}

function tablaMov(d){
  if(!d.length) return "<p>No hay movimientos con esos filtros.</p>";
  return `<table><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th class="n">Monto</th></tr>${d.map(m=>`<tr><td>${esc(m.fecha)}</td><td>${esc(m.cliente||"—")}<div class="items">${m.items.map(i=>`${i.cantidad} × ${esc(i.producto)}`).join(", ")}</div></td><td>${esc(m.tipo)}</td><td class="n">${money(m.monto)}</td></tr>`).join("")}</table>`;
}

async function verCliente(id){
  const d = await api("/api/consultas/cliente/"+encodeURIComponent(id));
  if(!d) return;
  $("out").innerHTML = `<h3>${esc(d.nombre)}</h3><div class="tarjetas"><div class="t t-rojo">Saldo<b class="${d.saldo>0?"deuda":"ok-saldo"}">${money(d.saldo)}</b></div><div class="t t-azul">Teléfono<b style="font-size:1rem">${esc(d.telefono||"—")}</b></div></div>`+tablaMov(d.movimientos);
}

$$("#tabs button").forEach(b => b.onclick = () => {
  $$("#tabs button").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-selected", "false"); }); b.classList.add("on"); b.setAttribute("aria-selected", "true");
  vista = b.dataset.v; pintarFiltros(); consultar();
});
(async()=>{ const c = await api("/api/catalogo"); clientes = c ? c.clientes : []; pintarFiltros(); consultar(); })();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
