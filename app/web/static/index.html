<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Libreta de Fiados Inteligente</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
        }

        h1 {
            font-size: 1.4rem;
        }

        .hidden {
            display: none;
        }

        button {
            padding: .6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            margin-right: .5rem;
        }

        button.sec {
            background: #eee;
            border: 1px solid #bbb;
        }

        button.mini {
            padding: .2rem .6rem;
            font-size: .85rem;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button:focus-visible,
        select:focus-visible,
        input:focus-visible,
        summary:focus-visible {
            outline: 3px solid #1d4f91;
            outline-offset: 2px;
        }

        #preview {
            max-width: 100%;
            max-height: 220px;
            margin: 1rem 0;
            display: none;
            border-radius: 8px;
        }

        .mov {
            border: 1px solid #ccc;
            border-left: 6px solid #2e9e4f;
            border-radius: 8px;
            padding: .8rem 1rem;
            margin: .8rem 0;
        }

        .mov.revisar {
            border-left-color: #d98a00;
            background: #fff8e8;
        }

        .mov.descartado {
            opacity: .45;
        }

        .cab {
            font-style: italic;
            color: #555;
            display: block;
            margin-bottom: .5rem;
        }

        .fila {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            align-items: center;
            margin: .4rem 0;
        }

        .fila label {
            font-size: .85rem;
            color: #555;
        }

        select,
        input[type=number] {
            padding: .3rem;
            font-size: .95rem;
        }

        input[type=number] {
            width: 6.5rem;
        }

        .item {
            background: #fafafa;
            border: 1px solid #e3e3e3;
            border-radius: 6px;
            padding: .4rem .6rem;
        }

        .suma {
            font-size: .9rem;
            color: #555;
        }

        .estado-mov {
            font-size: .9rem;
            margin-top: .4rem;
            font-weight: 600;
        }

        .estado-mov.bien {
            color: #176b34;
        }

        .estado-mov.mal {
            color: #a11;
        }

        .estado-mov.neutro {
            color: #777;
        }

        .aviso {
            color: #777;
            margin: .3rem 0 0;
            font-size: .85rem;
            display: block;
        }

        .linea {
            color: #555;
            font-size: .9rem;
            margin-top: .2rem;
        }

        .error {
            background: #fdecec;
            color: #a11;
            padding: .8rem 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .error ul {
            margin: .4rem 0 0 1.2rem;
            padding: 0;
        }

        .ok {
            background: #eaf7ee;
            color: #176b34;
            padding: .8rem 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .prueba {
            background: #eef3fb;
            color: #1d4f91;
            padding: .8rem 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .espera {
            background: #eef3fb;
            color: #1d4f91;
            padding: .8rem 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .totales {
            background: #f4f4f4;
            border-radius: 8px;
            padding: .6rem 1rem;
            margin: .8rem 0;
            font-size: .95rem;
        }

        #barra {
            position: sticky;
            bottom: 0;
            background: #fff;
            border-top: 1px solid #ddd;
            padding: .8rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .pasos {
            font-weight: 600;
        }

        /* Panel de trazas */
        details#trazas {
            margin: 1rem 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: .5rem 1rem;
            background: #fafafa;
        }

        details#trazas summary {
            cursor: pointer;
            font-weight: 600;
        }

        .traza {
            font-family: ui-monospace, Consolas, monospace;
            font-size: .8rem;
            margin: .5rem 0;
            color: #333;
            word-break: break-word;
        }

        .traza .estado-ok,
        .traza .estado-encontrado {
            color: #176b34;
            font-weight: 600;
        }

        .traza .estado-ambiguo {
            color: #b36b00;
            font-weight: 600;
        }

        .traza .estado-no_encontrado {
            color: #a11;
            font-weight: 600;
        }

        .traza .ms {
            color: #777;
        }

        @media (max-width: 520px) {
            body {
                margin: 1rem auto;
            }

            .fila {
                flex-direction: column;
                align-items: stretch;
            }

            .fila select,
            .fila input[type=number] {
                width: 100%;
                box-sizing: border-box;
            }

            #barra {
                flex-direction: column;
                align-items: stretch;
                gap: .4rem;
            }
        }
    </style>
</head>

<body>
    <h1>Libreta de Fiados Inteligente</h1>

    <!-- Paso 1 -->
    <section id="paso-subir">
        <p class="pasos">1. Sube una foto de la hoja</p>
        <input type="file" id="archivo" accept="image/jpeg,image/png">
        <img id="preview" alt="Vista previa de la foto">
        <div><button id="enviar" disabled>Leer hoja</button></div>
        <div id="estado" aria-live="polite"></div>
    </section>

    <!-- Paso 2 -->
    <section id="paso-revision" class="hidden">
        <p class="pasos">2. Revisa lo que entendió la IA y corrige lo que haga falta</p>
        <div id="tarjetas"></div>
        <details id="trazas">
            <summary>Trazas de la IA y las herramientas (<span id="n-trazas">0</span>)</summary>
            <div id="lista-trazas"></div>
        </details>
        <div id="barra">
            <button id="ir-resumen" disabled>Continuar</button>
            <span id="faltan"></span>
        </div>
    </section>

    <!-- Paso 3 -->
    <section id="paso-resumen" class="hidden">
        <p class="pasos">3. Confirma lo que se va a guardar</p>
        <div id="totales" class="totales"></div>
        <div id="lista-resumen"></div>
        <p><label><input type="checkbox" id="prueba" checked> Modo prueba (valida pero NO guarda los
                movimientos)</label></p>
        <div>
            <button id="volver" class="sec">Volver a editar</button>
            <button id="guardar">Guardar</button>
        </div>
        <div id="salida" aria-live="polite"></div>
    </section>

    <!-- Resultado -->
    <section id="paso-final" class="hidden">
        <div id="final"></div>
        <button id="nueva">Leer otra hoja</button>
    </section>

    <script>
        const $ = (id) => document.getElementById(id);
        const archivo = $("archivo"), preview = $("preview"), enviar = $("enviar"), estado = $("estado");
        const pasos = {
            subir: $("paso-subir"), revision: $("paso-revision"),
            resumen: $("paso-resumen"), final: $("paso-final"),
        };
        const MAX_MB = 5;                       // mismo limite que el servidor
        const REINTENTABLES = [429, 503, 504];  // errores donde tiene sentido volver a intentar
        let catalogo = null;
        let filas = [];
        let registro = { cliente: [], producto: [] };   // todos los selectores, para anadir altas nuevas
        let temporizador = null;

        function ir(paso) {
            Object.entries(pasos).forEach(([k, el]) => el.classList.toggle("hidden", k !== paso));
            window.scrollTo(0, 0);
        }

        function crear(tag, clase, texto) {
            const el = document.createElement(tag);
            if (clase) el.className = clase;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        function dinero(n) { return "$" + Number(n).toLocaleString("es-CO"); }

        function etiquetado(texto, control) {
            const l = crear("label", "", texto + " ");
            l.appendChild(control);
            return l;
        }

        function numero(valor) {
            const i = document.createElement("input");
            i.type = "number"; i.step = "any"; i.min = "0";
            i.value = valor ?? "";
            return i;
        }

        function selectorSimple(opciones, valor) {
            const s = document.createElement("select");
            opciones.forEach((o) => s.appendChild(new Option(o, o)));
            s.value = valor;
            return s;
        }

        // Sugeridos primero, luego todos. Si no hay elegido, queda en la opcion vacia.
        function selector(todos, sugeridos, elegidoId, vacio, tipo) {
            const s = document.createElement("select");
            s.appendChild(new Option(vacio, ""));
            if (sugeridos.length) {
                const g = document.createElement("optgroup");
                g.label = "Sugeridos";
                sugeridos.forEach((o) => g.appendChild(new Option(o.nombre, o.id)));
                s.appendChild(g);
            }
            const g2 = document.createElement("optgroup");
            g2.label = "Todos";
            todos.forEach((o) => g2.appendChild(new Option(o.nombre, o.id)));
            s.appendChild(g2);
            s.value = elegidoId ?? "";
            registro[tipo].push(s);
            return s;
        }

        function precioRef(productoId) {
            const p = catalogo.productos.find((x) => String(x.id) === String(productoId));
            return p ? p.precio_ref : "";
        }

        function mostrarError(msg, reintentable) {
            const caja = crear("div", "error", msg);
            if (reintentable) {
                const b = crear("button", "sec", "Reintentar");
                b.type = "button";
                b.addEventListener("click", () => enviar.click());
                caja.append(crear("br"), b);
            }
            estado.replaceChildren(caja);
        }

        async function cargarCatalogo() {
            try {
                const r = await fetch("/api/catalogo");
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        // ---------- Panel de trazas ----------
        function mostrarTrazas(trazas) {
            const lista = trazas || [];
            const cont = $("lista-trazas");
            cont.replaceChildren();
            lista.forEach((t) => {
                const linea = crear("div", "traza");
                linea.append(
                    `${t.herramienta}("${t.entrada}") → `,
                    crear("span", "estado-" + t.estado, t.estado),
                    ` · ${t.detalle} · `,
                    crear("span", "ms", `${t.ms} ms`)
                );
                cont.appendChild(linea);
            });
            if (!lista.length) cont.appendChild(crear("div", "traza", "Sin trazas."));
            $("n-trazas").textContent = lista.length;
        }

        // ---------- Altas del tendero (clientes, productos, apodos) ----------
        async function postJSON(url, cuerpo) {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(cuerpo),
            });
            let datos = null;
            try { datos = await res.json(); } catch (e) { }
            return { ok: res.ok, status: res.status, datos };
        }

        // Si el servidor dice que hay parecidos, el tendero decide si es otro o el mismo
        async function crearConConfirmacion(url, cuerpo, etiqueta) {
            let r;
            try { r = await postJSON(url, cuerpo); }
            catch (e) { alert("No se pudo conectar con el servidor."); return null; }

            const d = r.datos && r.datos.detail;
            if (!r.ok && r.status === 422 && d && d.parecidos && d.parecidos.length) {
                const lista = d.parecidos.map((p) => "- " + p.nombre).join("\n");
                const otro = confirm(
                    `Ya hay ${etiqueta} parecidos:\n${lista}\n\n` +
                    "Si es el mismo, cancela y elígelo de la lista.\n" +
                    "¿Crear uno nuevo de todos modos?"
                );
                if (!otro) return null;
                r = await postJSON(url, { ...cuerpo, confirmar_duplicado: true });
            }
            if (!r.ok) {
                const e = r.datos && r.datos.detail;
                alert(e && e.errores ? e.errores.join("\n") : (typeof e === "string" ? e : "No se pudo crear."));
                return null;
            }
            return r.datos;
        }

        function agregarOpcion(tipo, nuevo) {
            (tipo === "cliente" ? catalogo.clientes : catalogo.productos).push(nuevo);
            registro[tipo].forEach((s) => {
                const g = [...s.querySelectorAll("optgroup")].find((x) => x.label === "Todos");
                g.appendChild(new Option(nuevo.nombre, nuevo.id));
            });
        }

        async function nuevoCliente(f) {
            const nombre = prompt("Nombre del cliente nuevo:", f.m.cliente ?? "");
            if (!nombre) return;
            const c = await crearConConfirmacion("/api/clientes", { nombre }, "clientes");
            if (!c) return;
            agregarOpcion("cliente", c);
            f.cliente.value = c.id;
            refrescarTodo();
        }

        async function nuevoProducto(fi, textoOriginal) {
            const nombre = prompt("Nombre del producto nuevo:", textoOriginal);
            if (!nombre) return;
            const texto = prompt("Precio de referencia en pesos (sin puntos):", fi.precio.value || "");
            const precio = Number(texto);
            if (!texto || !Number.isFinite(precio) || precio <= 0) {
                alert("El precio debe ser un número mayor que cero.");
                return;
            }
            const p = await crearConConfirmacion("/api/productos", { nombre, precio_ref: precio }, "productos");
            if (!p) return;
            agregarOpcion("producto", p);
            fi.producto.value = p.id;
            if (fi.precio.value === "") fi.precio.value = p.precio_ref;
            refrescarTodo();
        }

        // ---------- Lectura y reglas de una tarjeta ----------
        function leer(f) {
            return {
                tipo: f.tipo.value,
                cliente_id: f.cliente.value ? Number(f.cliente.value) : null,
                monto: f.monto.value === "" ? null : Number(f.monto.value),
                items: f.items.map((i) => ({
                    producto_id: i.producto.value ? Number(i.producto.value) : null,
                    cantidad: i.cantidad.value === "" ? null : Number(i.cantidad.value),
                    precio_unitario: i.precio.value === "" ? null : Number(i.precio.value),
                })),
            };
        }

        function problemas(f) {
            const d = leer(f), p = [];
            if ((d.tipo === "fiado" || d.tipo === "abono") && d.cliente_id === null) p.push("elige el cliente (o crea uno nuevo)");
            if (d.tipo === "abono" && d.items.length) p.push("un abono no lleva productos (cambia el tipo o descarta el movimiento)");
            if (d.monto === null) p.push("falta el monto");
            else if (d.monto <= 0) p.push("el monto debe ser mayor que 0");
            d.items.forEach((i) => {
                if (i.producto_id === null) p.push("elige el producto (o crea uno nuevo)");
                if (i.cantidad === null || i.cantidad <= 0) p.push("la cantidad debe ser mayor que 0");
                if (i.precio_unitario === null || i.precio_unitario < 0) p.push("falta el precio");
            });
            const completos = d.items.length > 0 && d.items.every((i) => i.cantidad !== null && i.precio_unitario !== null);
            if (completos && d.monto !== null) {
                const total = d.items.reduce((a, i) => a + i.cantidad * i.precio_unitario, 0);
                if (Math.abs(total - d.monto) >= 0.01) {
                    p.push(`los productos suman ${dinero(total)} y el monto es ${dinero(d.monto)}`);
                }
            }
            return [...new Set(p)];
        }

        // ---------- Tarjeta de un movimiento ----------
        function tarjeta(m) {
            const f = { m, items: [] };
            const card = crear("div", "mov");

            const cab = crear("label", "cab");
            f.incluir = document.createElement("input");
            f.incluir.type = "checkbox"; f.incluir.checked = true;
            cab.append(f.incluir, ` "${m.texto_original}"  (desmarca para descartar)`);
            card.appendChild(cab);

            const rc = m.cliente_resuelto;
            f.tipo = selectorSimple(["fiado", "abono", "venta"], m.tipo);
            f.cliente = selector(
                catalogo.clientes,
                rc ? rc.candidatos : [],
                rc && rc.estado === "encontrado" ? rc.elegido.id : "",
                "- sin cliente / elegir -",
                "cliente"
            );
            f.monto = numero(m.monto);

            const bNuevoC = crear("button", "sec mini", "+ Nuevo");
            bNuevoC.type = "button";
            bNuevoC.addEventListener("click", () => nuevoCliente(f));

            const filaTop = crear("div", "fila");
            filaTop.append(etiquetado("Tipo", f.tipo), etiquetado("Cliente", f.cliente), bNuevoC, etiquetado("Monto $", f.monto));
            card.appendChild(filaTop);

            m.items.forEach((it) => {
                const pr = it.producto_resuelto;
                const fi = {};
                fi.producto = selector(
                    catalogo.productos,
                    pr ? pr.candidatos : [],
                    pr && pr.estado === "encontrado" ? pr.elegido.id : "",
                    "- elegir producto -",
                    "producto"
                );
                fi.cantidad = numero(it.cantidad);
                fi.precio = numero(
                    it.precio_unitario ??
                    (pr && pr.estado === "encontrado" ? precioRef(pr.elegido.id) : "")
                );
                // Si se elige un producto y no hay precio, se propone el del catalogo
                fi.producto.addEventListener("change", () => {
                    if (fi.precio.value === "") fi.precio.value = precioRef(fi.producto.value);
                });
                const bNuevoP = crear("button", "sec mini", "+ Nuevo");
                bNuevoP.type = "button";
                bNuevoP.addEventListener("click", () => nuevoProducto(fi, it.producto));

                const fila = crear("div", "fila item");
                fila.append(crear("span", "", `"${it.producto}"`), fi.producto, bNuevoP,
                    etiquetado("Cant.", fi.cantidad), etiquetado("Precio", fi.precio));
                card.appendChild(fila);
                f.items.push(fi);
            });

            f.suma = crear("div", "suma");
            f.estado = crear("div", "estado-mov");
            card.append(f.suma, f.estado);

            // Casilla para que el sistema aprenda el apodo (solo si se guarda de verdad)
            f.aliasFila = crear("label", "aviso");
            f.aliasChk = document.createElement("input");
            f.aliasChk.type = "checkbox";
            f.aliasTxt = crear("span", "");
            f.aliasFila.append(f.aliasChk, f.aliasTxt);
            f.aliasFila.style.display = "none";
            card.appendChild(f.aliasFila);

            m.advertencias.forEach((a) => card.appendChild(crear("p", "aviso", "Aviso inicial: " + a)));

            f.card = card;
            f.refrescar = () => {
                const activo = f.incluir.checked;
                card.classList.toggle("descartado", !activo);
                const p = activo ? problemas(f) : [];
                card.classList.toggle("revisar", p.length > 0);

                const d = leer(f);
                const total = d.items.reduce((a, i) => a + (i.cantidad || 0) * (i.precio_unitario || 0), 0);
                f.suma.textContent = d.items.length ? "Los productos suman " + dinero(total) : "";

                if (!activo) { f.estado.textContent = "Descartado: no se guardará."; f.estado.className = "estado-mov neutro"; }
                else if (p.length) { f.estado.textContent = "Falta: " + p.join("; ") + "."; f.estado.className = "estado-mov mal"; }
                else { f.estado.textContent = "✓ Listo"; f.estado.className = "estado-mov bien"; }

                // Ofrecer recordar el apodo si el tendero eligio un cliente que el sistema no habia reconocido
                const sel = f.cliente.value;
                const texto = (f.m.cliente || "").trim();
                const reconocido = rc && rc.estado === "encontrado" && String(rc.elegido.id) === sel;
                const mostrar = activo && sel && texto.length >= 2 && !reconocido;
                f.aliasFila.style.display = mostrar ? "" : "none";
                if (mostrar) {
                    f.aliasTxt.textContent = ` Recordar "${texto}" como apodo de ${f.cliente.selectedOptions[0].text} (se guarda al guardar de verdad)`;
                }
                return p.length > 0;
            };
            // input y change burbujean: cualquier edicion de la tarjeta recalcula todo
            card.addEventListener("input", refrescarTodo);
            card.addEventListener("change", refrescarTodo);
            return f;
        }

        function refrescarTodo() {
            let activos = 0, pendientes = 0;
            filas.forEach((f) => {
                if (f.incluir.checked) activos++;
                if (f.refrescar()) pendientes++;
            });
            $("ir-resumen").disabled = !(activos > 0 && pendientes === 0);
            $("faltan").textContent =
                activos === 0 ? "No hay movimientos marcados."
                    : pendientes ? `${pendientes} movimiento(s) por corregir.`
                        : `${activos} movimiento(s) listos.`;
        }

        function mostrarHoja(hoja) {
            if (hoja.bd_disponible === false || !catalogo) {
                mostrarError("No se pudo consultar la base de datos. Revisa que Docker esté activo y que DATABASE_URL sea correcto.", true);
                return false;
            }
            registro = { cliente: [], producto: [] };
            $("tarjetas").replaceChildren();
            filas = hoja.movimientos.map((m) => tarjeta(m));
            filas.forEach((f) => $("tarjetas").appendChild(f.card));
            mostrarTrazas(hoja.trazas);
            refrescarTodo();
            ir("revision");
            return true;
        }

        // ---------- Paso 3: resumen ----------
        $("ir-resumen").addEventListener("click", () => {
            const lista = $("lista-resumen");
            lista.replaceChildren();
            const sumas = { fiado: 0, abono: 0, venta: 0 };
            filas.filter((f) => f.incluir.checked).forEach((f) => {
                const d = leer(f);
                sumas[d.tipo] += d.monto;
                const cliente = f.cliente.value ? f.cliente.selectedOptions[0].text : "(sin cliente)";
                const caja = crear("div", "mov");
                caja.appendChild(crear("strong", "", `${cliente} · ${d.tipo} · ${dinero(d.monto)}`));
                d.items.forEach((i, k) => {
                    const nombre = f.items[k].producto.selectedOptions[0].text;
                    caja.appendChild(crear("div", "linea", `${i.cantidad} × ${nombre} a ${dinero(i.precio_unitario)}`));
                });
                lista.appendChild(caja);
            });
            $("totales").textContent =
                `Fiados: ${dinero(sumas.fiado)} · Abonos: ${dinero(sumas.abono)} · Ventas de contado: ${dinero(sumas.venta)}`;
            $("salida").replaceChildren();
            ir("resumen");
        });

        $("volver").addEventListener("click", () => ir("revision"));

        async function guardarApodos() {
            for (const f of filas) {
                const visible = f.aliasFila.style.display !== "none";
                if (f.incluir.checked && visible && f.aliasChk.checked) {
                    try {
                        await postJSON("/api/alias", { cliente_id: Number(f.cliente.value), alias: f.m.cliente.trim() });
                    } catch (e) { /* el apodo es opcional: si falla, no se frena el guardado */ }
                }
            }
        }

        $("guardar").addEventListener("click", async () => {
            const simular = $("prueba").checked;
            if (!simular && !confirm("Esto guarda de verdad en la base de datos y NO se puede deshacer. ¿Continuar?")) return;

            const salida = $("salida");
            salida.replaceChildren();
            $("guardar").disabled = true;
            $("volver").disabled = true;

            const movimientos = filas.filter((f) => f.incluir.checked).map((f) => {
                const d = leer(f);
                return { cliente_id: d.cliente_id, tipo: d.tipo, monto: d.monto, items: d.items, texto_original: f.m.texto_original };
            });

            try {
                const res = await fetch("/api/confirmar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ movimientos, archivo: archivo.files[0]?.name ?? null, simular }),
                });
                const cuerpo = await res.json().catch(() => ({}));

                if (!res.ok) {
                    const caja = crear("div", "error", "No se guardó nada. Corrige esto:");
                    const ul = crear("ul", "");
                    const errores = cuerpo.detail && cuerpo.detail.errores;
                    if (errores) errores.forEach((e) => ul.appendChild(crear("li", "", e)));
                    else ul.appendChild(crear("li", "", typeof cuerpo.detail === "string" ? cuerpo.detail : "Hay datos incompletos o inválidos."));
                    caja.appendChild(ul);
                    salida.appendChild(caja);
                    $("guardar").disabled = false;
                    $("volver").disabled = false;
                    return;
                }
                if (cuerpo.guardado) await guardarApodos();
                mostrarFinal(cuerpo);
            } catch (e) {
                salida.appendChild(crear("div", "error", "No se pudo conectar con el servidor."));
                $("guardar").disabled = false;
                $("volver").disabled = false;
            }
        });

        function mostrarFinal(c) {
            const cont = $("final");
            cont.replaceChildren();
            cont.appendChild(crear("div", c.guardado ? "ok" : "prueba",
                c.guardado ? "Guardado en la base de datos."
                    : "Prueba exitosa: todo es válido, pero NO se guardó nada."));
            const ul = crear("ul", "");
            c.resultados.forEach((r) => {
                const quien = r.cliente ?? "Venta sin cliente";
                const saldo = r.saldo !== null && r.saldo !== undefined ? ` → saldo (lo que debe): ${dinero(r.saldo)}` : "";
                ul.appendChild(crear("li", "", `${quien} · ${r.tipo} · ${dinero(r.monto)}${saldo}`));
            });
            cont.appendChild(ul);
            $("guardar").disabled = false;
            $("volver").disabled = false;
            ir("final");
        }

        $("nueva").addEventListener("click", () => {
            archivo.value = "";
            preview.style.display = "none";
            enviar.disabled = true;
            estado.replaceChildren();
            filas = [];
            registro = { cliente: [], producto: [] };
            mostrarTrazas([]);
            ir("subir");
        });

        // ---------- Paso 1: subir y leer ----------
        archivo.addEventListener("change", () => {
            const f = archivo.files[0];
            if (!f) return;
            if (f.size > MAX_MB * 1024 * 1024) {
                archivo.value = "";
                preview.style.display = "none";
                enviar.disabled = true;
                mostrarError(`La foto pesa ${(f.size / 1048576).toFixed(1)} MB. El máximo es ${MAX_MB} MB: sube una más liviana.`, false);
                return;
            }
            preview.src = URL.createObjectURL(f);
            preview.style.display = "block";
            enviar.disabled = false;
            estado.replaceChildren();
        });

        // Mensaje de espera que cambia si la IA tarda
        function iniciarEspera() {
            const caja = crear("div", "espera", "Leyendo la hoja con IA… puede tardar unos segundos.");
            estado.replaceChildren(caja);
            const inicio = Date.now();
            temporizador = setInterval(() => {
                const s = Math.round((Date.now() - inicio) / 1000);
                caja.textContent = s < 10
                    ? "Leyendo la hoja con IA… puede tardar unos segundos."
                    : `Sigue leyendo (${s} s). La letra a mano puede tardar más, no cierres la página.`;
            }, 1000);
        }

        function terminarEspera() {
            clearInterval(temporizador);
            temporizador = null;
        }

        enviar.addEventListener("click", async () => {
            const f = archivo.files[0];
            if (!f) return;
            enviar.disabled = true;
            iniciarEspera();

            const datos = new FormData();
            datos.append("foto", f);
            try {
                const [res, cat] = await Promise.all([
                    fetch("/api/extraer", { method: "POST", body: datos }),
                    cargarCatalogo(),
                ]);
                catalogo = cat;
                const cuerpo = await res.json().catch(() => ({}));
                terminarEspera();
                if (!res.ok) {
                    mostrarError(
                        typeof cuerpo.detail === "string" ? cuerpo.detail : "Error al procesar la foto.",
                        REINTENTABLES.includes(res.status)
                    );
                } else {
                    estado.replaceChildren();
                    mostrarHoja(cuerpo);
                }
            } catch (e) {
                terminarEspera();
                mostrarError("No se pudo conectar con el servidor.", true);
            } finally {
                terminarEspera();
                enviar.disabled = false;
            }
        });
    </script>
</body>

</html>
