services:
  db:
    image: postgres:16
    container_name: fiados_db
    environment:
      POSTGRES_USER: fiados
      POSTGRES_PASSWORD: fiados
      POSTGRES_DB: fiados
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiados -d fiados"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: fiados_app
    env_file: .env
    environment:
      # Dentro de Docker la BD se llama "db" y usa el puerto interno 5432
      DATABASE_URL: postgresql://fiados:fiados@db:5432/fiados
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: